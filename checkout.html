<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEKZZ Checkout</title>
<style>
body{margin:0;font-family:Arial;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;text-align:center;padding:20px}
.container{max-width:600px;margin:auto;padding:20px}
.card{background:white;padding:24px;border-radius:16px;box-shadow:0 3px 12px #0002}
.row{padding:14px 0;border-bottom:1px solid #eee}
.label{font-size:13px;color:#6b7280}
.value{font-weight:bold;margin-top:5px}
.total{font-size:24px}
.dana{font-size:22px;color:#2563eb}
button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:10px;background:#16a34a;color:white;font-weight:bold;font-size:16px}
.status{margin-top:20px;padding:13px;background:#fef3c7;color:#92400e;text-align:center;border-radius:10px;font-weight:bold}
</style>
</head>

<body>

<header>
<h1>PEKZZ</h1>
<p>Checkout & Pembayaran</p>
</header>

<div class="container">
<div class="card">

<h2>Pembayaran Pesanan</h2>

<div class="row">
<div class="label">Nomor Order</div>
<div class="value">PEKZZ-001</div>
</div>

<div class="row">
<div class="label">Produk</div>
<div class="value">Diamond</div>
</div>

<div class="row">
<div class="label">Total Pembayaran</div>
<div class="value total">Rp20.000</div>
</div>

<div class="row">
<div class="label">DANA Tujuan</div>
<div class="value dana">089674161923</div>
</div>

<p>
Transfer tepat sesuai jumlah di atas ke nomor DANA tersebut.
Setelah transfer berhasil, tekan tombol di bawah.
</p>

<button onclick="konfirmasi()">
Saya Sudah Transfer
</button>

<div id="status" class="status">
Menunggu Verifikasi
</div>

</div>
</div>

<script>
function konfirmasi(){
document.getElementById("status").textContent =
"Menunggu Verifikasi";
alert("Konfirmasi transfer berhasil dikirim.");
}
</script>

</body>
</html>
