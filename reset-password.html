<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEKZZ - Reset Password</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.container{
  max-width:450px;
  margin:60px auto;
  padding:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 3px 12px #0002;
}

h1{
  text-align:center;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:8px 0 15px;
  border:1px solid #d1d5db;
  border-radius:9px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

#message{
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>PEKZZ</h1>

<h2>Reset Password Admin</h2>

<p>Buat password baru untuk akun Admin.</p>

<input
  id="password"
  type="password"
  placeholder="Password baru"
>

<input
  id="confirm"
  type="password"
  placeholder="Ulangi password"
>

<button onclick="ubahPassword()">
Simpan Password
</button>

<div id="message"></div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ptluxzkjvdhzsiejsmov.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KH094rcfrlbQZ2wT9iKbBw_3H4edUdE";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if(event === "PASSWORD_RECOVERY"){
      console.log(
        "Mode recovery aktif"
      );
    }

  }
);

async function ubahPassword(){

  const password =
    document.getElementById("password").value;

  const confirm =
    document.getElementById("confirm").value;

  const message =
    document.getElementById("message");

  if(!password || !confirm){

    message.textContent =
      "Isi kedua password.";

    return;
  }

  if(password !== confirm){

    message.textContent =
      "Password tidak sama.";

    return;
  }

  if(password.length < 8){

    message.textContent =
      "Gunakan password minimal 8 karakter.";

    return;
  }

  message.textContent =
    "Menyimpan password...";

  const { error } =
    await supabaseClient.auth.updateUser({
      password: password
    });

  if(error){

    console.error(error);

    message.textContent =
      "Gagal: " + error.message;

    return;
  }

  message.textContent =
    "Password berhasil diubah.";

}

</script>

</body>
</html>
