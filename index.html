<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEKZZ - Top Up Game</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}
.logo{
  font-size:30px;
  font-weight:bold;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.hero{
  background:#2563eb;
  color:white;
  padding:25px;
  border-radius:16px;
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-top:20px;
}
.card,.checkout{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 12px #0002;
}
.price{
  font-weight:bold;
  font-size:18px;
}
button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  margin-top:10px;
}
input,select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}
.hidden{
  display:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">PEKZZ</div>
  TOP UP GAME
</header>

<div class="container">

  <div class="hero">
    <h1>Top Up Cepat & Mudah</h1>
    <p>Pesan produk game dengan mudah.</p>
  </div>

  <h2>Produk</h2>

  <div class="products">

    <div class="card">
      <h3>⚔️ ML 86 Diamonds</h3>
      <p class="price">Rp20.000</p>
      <button onclick="pilih('ML 86 Diamonds',20000)">
        Pilih
      </button>
    </div>

    <div class="card">
      <h3>🔥 FF 70 Diamonds</h3>
      <p class="price">Rp10.000</p>
      <button onclick="pilih('FF 70 Diamonds',10000)">
        Pilih
      </button>
    </div>

    <div class="card">
      <h3>🎯 PUBG 60 UC</h3>
      <p class="price">Rp15.000</p>
      <button onclick="pilih('PUBG 60 UC',15000)">
        Pilih
      </button>
    </div>

  </div>

  <div id="checkout" class="checkout hidden">

    <h2>Checkout</h2>

    <p id="produk"></p>

    <input id="nama" placeholder="Nama">

    <input id="kontak"
           placeholder="WhatsApp / Email">

    <input id="tujuan"
           placeholder="ID Game / Nomor Tujuan">

    <select id="payment">
      <option>DANA</option>
      <option>QRIS</option>
      <option>Transfer Bank</option>
    </select>

    <button onclick="buatPesanan()">
      Buat Pesanan
    </button>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://ptluxzkjvdhzsiejsmov.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KH094rcfrlbQZ2wT9iKbBw_3H4edUdE";

let produk = "";
let harga = 0;

function pilih(nama,hargaProduk){

  produk = nama;
  harga = hargaProduk;

  document
    .getElementById("checkout")
    .classList.remove("hidden");

  document.getElementById("produk").innerHTML =
    "Produk: <b>" + produk + "</b><br>" +
    "Harga: <b>Rp" +
    harga.toLocaleString("id-ID") +
    "</b>";

  document
    .getElementById("checkout")
    .scrollIntoView({
      behavior:"smooth"
    });
}

async function buatPesanan(){

  const nama =
    document.getElementById("nama")
      .value.trim();

  const kontak =
    document.getElementById("kontak")
      .value.trim();

  const tujuan =
    document.getElementById("tujuan")
      .value.trim();

  const payment =
    document.getElementById("payment")
      .value;

  if(!nama || !kontak || !tujuan){

    alert(
      "Lengkapi semua data terlebih dahulu."
    );

    return;
  }

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/orders?select=id",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Prefer":
            "return=representation"
        },

        body:JSON.stringify({

          customer_name:nama,

          product_name:produk,

          quantity:1,

          status:"pending",

          payment_status:"unpaid",

          payment_method:payment,

          notes:
            "Pesanan dari website Pekzz. " +
            "Tujuan: " + tujuan,

          customer_email:kontak,

          price_per_item:harga

        })
      }
    );

    if(!response.ok){

      const error =
        await response.text();

      throw new Error(error);
    }

    const data =
      await response.json();

    if(
      !data ||
      !data.length ||
      !data[0].id
    ){

      throw new Error(
        "ID pesanan tidak diterima."
      );
    }

    const orderId =
      data[0].id;

    window.location.href =
      "checkout.html?order=" +
      encodeURIComponent(orderId);

  }

  catch(error){

    console.error(error);

    alert(
      "Pesanan gagal disimpan. Coba lagi."
    );
  }
}

</script>

</body>
</html>
