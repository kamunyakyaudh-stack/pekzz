<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEKZZ Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:20px;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:14px;
  box-shadow:0 2px 10px #0002;
}
button{
  padding:10px 14px;
  border:0;
  border-radius:8px;
  color:white;
  font-weight:bold;
  margin:4px;
}
.accept{background:#16a34a}
.reject{background:#dc2626}
.finish{background:#7c3aed}
.refresh{background:#2563eb}
.status{
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>PEKZZ ADMIN</h1>
<p>Panel Pengelolaan Pesanan</p>
</header>

<div class="container">

<button class="refresh" onclick="loadOrders()">
Refresh Pesanan
</button>

<div id="orders">
Memuat pesanan...
</div>

</div>

<script>

const SUPABASE_URL =
"https://ptluxzkjvdhzsiejsmov.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KH094rcfrlbQZ2wT9iKbBw_3H4edUdE";

async function loadOrders(){

const box=document.getElementById("orders");

box.innerHTML="Memuat...";

try{

const response=await fetch(
SUPABASE_URL+
"/rest/v1/orders?select=*&order=created_at.desc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}
);

if(!response.ok){

const error=await response.text();

throw new Error(error);

}

const orders=await response.json();

if(orders.length===0){

box.innerHTML=
"<div class='card'>Belum ada pesanan.</div>";

return;

}

box.innerHTML="";

orders.forEach(order=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<h3>Order #${order.id}</h3>

<p>
<b>Nama:</b>
${order.customer_name||"-"}
</p>

<p>
<b>Produk:</b>
${order.product_name||"-"}
</p>

<p>
<b>Jumlah:</b>
${order.quantity||1}
</p>

<p>
<b>Harga:</b>
Rp${Number(order.price_per_item||0)
.toLocaleString("id-ID")}
</p>

<p>
<b>Kontak:</b>
${order.customer_email||"-"}
</p>

<p>
<b>Metode pembayaran:</b>
${order.payment_method||"-"}
</p>

<p>
<b>Status pembayaran:</b>
<span class="status">
${order.payment_status||"-"}
</span>
</p>

<p>
<b>Status pesanan:</b>
<span class="status">
${order.status||"-"}
</span>
</p>

<button
class="accept"
onclick="updatePayment('${order.id}','paid')">
Pembayaran Diterima
</button>

<button
class="reject"
onclick="updatePayment('${order.id}','rejected')">
Tolak
</button>

<button
class="finish"
onclick="finishOrder('${order.id}')">
Pesanan Selesai
</button>

`;

box.appendChild(card);

});

}

catch(error){

console.error(error);

box.innerHTML=
"<div class='card'>Gagal mengambil pesanan.</div>";

}

}


async function updatePayment(id,status){

if(!confirm("Yakin mengubah status pembayaran?")){

return;

}

try{

const response=await fetch(

SUPABASE_URL+
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),

{
method:"PATCH",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Prefer":"return=minimal"
},

body:JSON.stringify({

payment_status:status,

status:
status==="paid"
?"processing"
:"rejected"

})

}

);

if(!response.ok){

const error=await response.text();

throw new Error(error);

}

alert("Status berhasil diperbarui.");

loadOrders();

}

catch(error){

console.error(error);

alert("Gagal mengubah status pembayaran.");

}

}


async function finishOrder(id){

if(!confirm("Tandai pesanan sebagai selesai?")){

return;

}

try{

const response=await fetch(

SUPABASE_URL+
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),

{
method:"PATCH",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Prefer":"return=minimal"
},

body:JSON.stringify({

status:"completed"

})

}

);

if(!response.ok){

const error=await response.text();

throw new Error(error);

}

alert("Pesanan ditandai selesai.");

loadOrders();

}

catch(error){

console.error(error);

alert("Gagal mengubah status pesanan.");

}

}

loadOrders();

</script>

</body>
</html>
