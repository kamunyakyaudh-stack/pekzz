<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEKZZ Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #0002;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  box-sizing:border-box;
  border-radius:8px;
}
input{
  border:1px solid #ccc;
}
button{
  border:0;
  background:#2563eb;
  color:white;
  font-weight:bold;
}
.logout{
  background:#dc2626;
}
.order{
  border-top:1px solid #ddd;
  margin-top:15px;
  padding-top:15px;
}
.action{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.action button{
  width:auto;
}
.green{background:#16a34a}
.red{background:#dc2626}
.purple{background:#7c3aed}
.message{
  margin-top:12px;
  padding:12px;
  background:#f3f4f6;
  border-radius:8px;
}
.hidden{
  display:none;
}
</style>
</head>

<body>

<header>
<h1>PEKZZ ADMIN</h1>
<p>Order Processing</p>
</header>

<div class="container">

<div id="loginBox" class="card">

<h2>Login Admin</h2>

<input
id="email"
type="email"
placeholder="Email admin">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<div id="loginMessage"></div>

</div>

<div id="adminBox" class="hidden">

<div class="card">

<h2>Daftar Pesanan</h2>

<button onclick="loadOrders()">
🔄 Refresh Pesanan
</button>

<button class="logout" onclick="logout()">
Keluar
</button>

<div id="message" class="message">
Memuat...
</div>

<div id="orders"></div>

</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://ptluxzkjvdhzsiejsmov.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KH094rcfrlbQZ2wT9iKbBw_3H4edUdE";

let accessToken = null;

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const msg =
document.getElementById("loginMessage");

if(!email || !password){

msg.innerHTML =
'<div class="message">Isi email dan password.</div>';

return;
}

msg.innerHTML =
'<div class="message">Login...</div>';

try{

const response =
await fetch(
SUPABASE_URL +
"/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},

body:JSON.stringify({
email:email,
password:password
})
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
"Login gagal"
);

}

accessToken =
data.access_token;

document
.getElementById("loginBox")
.classList.add("hidden");

document
.getElementById("adminBox")
.classList.remove("hidden");

await loadOrders();

}

catch(error){

msg.innerHTML =
'<div class="message">' +
error.message +
'</div>';

}

}

async function loadOrders(){

const message =
document.getElementById("message");

const orders =
document.getElementById("orders");

message.textContent =
"Memuat pesanan...";

orders.innerHTML="";

try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/orders" +
"?select=*" +
"&order=id.desc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + accessToken
}
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.message ||
"Pesanan tidak dapat diambil"
);

}

if(data.length === 0){

message.textContent =
"Belum ada pesanan.";

return;

}

message.textContent =
"Total pesanan: " + data.length;

data.forEach(order=>{

const total =
Number(order.price_per_item || 0) *
Number(order.quantity || 1);

const div =
document.createElement("div");

div.className="order";

div.innerHTML=`

<h3>Order #${order.id}</h3>

<p>
<b>Nama:</b>
${safe(order.customer_name)}
</p>

<p>
<b>Produk:</b>
${safe(order.product_name)}
</p>

<p>
<b>Jumlah:</b>
${order.quantity || 1}
</p>

<p>
<b>Total:</b>
Rp${total.toLocaleString("id-ID")}
</p>

<p>
<b>Pembayaran:</b>
${safe(order.payment_status)}
</p>

<p>
<b>Status:</b>
${safe(order.status)}
</p>

<div class="action">

<button class="green"
onclick="updatePayment(${order.id},'paid')">
Terima Pembayaran
</button>

<button class="red"
onclick="updatePayment(${order.id},'rejected')">
Tolak Pembayaran
</button>

<button
onclick="updateStatus(${order.id},'processing')">
Proses
</button>

<button class="purple"
onclick="updateStatus(${order.id},'completed')">
Selesai
</button>

</div>

`;

orders.appendChild(div);

});

}

catch(error){

message.textContent =
"Gagal: " + error.message;

}

}

async function updatePayment(id,status){

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/orders?id=eq." +
id,
{
method:"PATCH",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + accessToken,
"Prefer":"return=minimal"
},

body:JSON.stringify({
payment_status:status
})
}
);

if(!response.ok){

alert("Gagal mengubah pembayaran.");

return;

}

alert("Berhasil diubah.");

loadOrders();

}

async function updateStatus(id,status){

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/orders?id=eq." +
id,
{
method:"PATCH",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + accessToken,
"Prefer":"return=minimal"
},

body:JSON.stringify({
status:status
})
}
);

if(!response.ok){

alert("Gagal mengubah status.");

return;

}

alert("Status berhasil diubah.");

loadOrders();

}

function logout(){

accessToken=null;

document
.getElementById("adminBox")
.classList.add("hidden");

document
.getElementById("loginBox")
.classList.remove("hidden");

document
.getElementById("password")
.value="";

}

function safe(value){

return String(value || "-")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
