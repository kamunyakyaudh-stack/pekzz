<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEKZZ - Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:15px;
  box-shadow:0 3px 12px #0002;
}

.order{
  border-top:1px solid #eee;
  padding-top:15px;
  margin-top:15px;
}

.row{
  margin:8px 0;
}

.label{
  color:#6b7280;
  font-size:13px;
}

.value{
  font-weight:bold;
}

button{
  padding:11px 14px;
  border:0;
  border-radius:8px;
  color:white;
  font-weight:bold;
  margin:5px 5px 0 0;
  cursor:pointer;
}

.accept{
  background:#16a34a;
}

.reject{
  background:#dc2626;
}

.process{
  background:#2563eb;
}

.complete{
  background:#7c3aed;
}

.refresh{
  width:100%;
  background:#111827;
}

.message{
  padding:12px;
  background:#f3f4f6;
  border-radius:8px;
  margin-bottom:15px;
}

.error{
  color:#dc2626;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>PEKZZ ADMIN</h1>
<p>Order Processing</p>
</header>

<div class="container">

<div class="card">

<h2>Daftar Pesanan</h2>

<button class="refresh" onclick="loadOrders()">
Refresh Pesanan
</button>

<div id="message" class="message">
Memuat pesanan...
</div>

<div id="orders"></div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://ptluxzkjvdhzsiejsmov.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KH094rcfrlbQZ2wT9iKbBw_3H4edUdE";

async function loadOrders(){

const message =
document.getElementById("message");

const ordersBox =
document.getElementById("orders");

message.textContent =
"Memuat pesanan...";

ordersBox.innerHTML="";

try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/orders" +
"?select=id,customer_name,product_name,quantity,price_per_item,payment_method,payment_status,status,created_at" +
"&order=id.desc",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + SUPABASE_KEY
}
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

const data =
await response.json();

if(!data.length){

message.textContent =
"Belum ada pesanan.";

return;

}

message.textContent =
"Pesanan ditemukan: " +
data.length;

data.forEach(order=>{

const total =
Number(order.price_per_item || 0) *
Number(order.quantity || 1);

const div =
document.createElement("div");

div.className="order";

div.innerHTML=`

<h3>Order #${order.id}</h3>

<div class="row">
<div class="label">Nama</div>
<div class="value">
${escapeHtml(order.customer_name || "-")}
</div>
</div>

<div class="row">
<div class="label">Produk</div>
<div class="value">
${escapeHtml(order.product_name || "-")}
</div>
</div>

<div class="row">
<div class="label">Jumlah</div>
<div class="value">
${order.quantity || 1}
</div>
</div>

<div class="row">
<div class="label">Total</div>
<div class="value">
Rp${total.toLocaleString("id-ID")}
</div>
</div>

<div class="row">
<div class="label">Metode Pembayaran</div>
<div class="value">
${escapeHtml(order.payment_method || "-")}
</div>
</div>

<div class="row">
<div class="label">Pembayaran</div>
<div class="value">
${formatPayment(order.payment_status)}
</div>
</div>

<div class="row">
<div class="label">Status Pesanan</div>
<div class="value">
${formatStatus(order.status)}
</div>
</div>

<div>

<button class="accept"
onclick="updatePayment(${order.id},'paid')">
Terima Pembayaran
</button>

<button class="reject"
onclick="updatePayment(${order.id},'rejected')">
Tolak Pembayaran
</button>

<button class="process"
onclick="updateOrder(${order.id},'processing')">
Proses Pesanan
</button>

<button class="complete"
onclick="updateOrder(${order.id},'completed')">
Selesai
</button>

</div>

`;

ordersBox.appendChild(div);

});

}

catch(error){

console.error(error);

message.innerHTML =
'<div class="error">' +
"Gagal mengambil pesanan." +
"</div>";

}

}

async function updatePayment(id,status){

try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/orders?id=eq." +
encodeURIComponent(id),
{
method:"PATCH",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + SUPABASE_KEY,
"Prefer":"return=minimal"
},

body:JSON.stringify({
payment_status:status
})
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

alert(
status === "paid"
? "Pembayaran diterima."
: "Pembayaran ditolak."
);

loadOrders();

}

catch(error){

alert(
"Gagal mengubah pembayaran."
);

console.error(error);

}

}

async function updateOrder(id,status){

try{

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/orders?id=eq." +
encodeURIComponent(id),
{
method:"PATCH",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + SUPABASE_KEY,
"Prefer":"return=minimal"
},

body:JSON.stringify({
status:status
})
}
);

if(!response.ok){

throw new Error(
await response.text()
);

}

alert(
status === "processing"
? "Pesanan sedang diproses."
: "Pesanan selesai."
);

loadOrders();

}

catch(error){

alert(
"Gagal mengubah status pesanan."
);

console.error(error);

}

}

function formatPayment(status){

if(status === "paid")
return "Pembayaran Diterima";

if(status === "waiting_verification")
return "Menunggu Verifikasi";

if(status === "rejected")
return "Pembayaran Ditolak";

return "Belum Dibayar";

}

function formatStatus(status){

if(status === "completed")
return "Selesai";

if(status === "processing")
return "Sedang Diproses";

return "Menunggu Pembayaran";

}

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

loadOrders();

</script>

</body>
</html>
