<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEKZZ ADMIN</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:25px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #0002;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  padding:13px 18px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.hidden{
  display:none;
}

.error{
  color:#dc2626;
  margin-top:10px;
}

.success{
  color:#16a34a;
  margin-top:10px;
}

.order{
  border-top:1px solid #ddd;
  padding-top:15px;
  margin-top:15px;
}
</style>
</head>

<body>

<header>
<h1>PEKZZ ADMIN</h1>
<p>Panel Pengelolaan Pesanan</p>
</header>

<div class="container">

<div id="loginBox" class="card">

<h2>Login Admin</h2>

<input
id="email"
type="email"
placeholder="Email Admin"
value="raufmaruf003@gmail.com"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button id="loginButton">
Login
</button>

<div id="message"></div>

</div>

<div id="adminBox" class="hidden">

<div class="card">

<b id="loggedEmail"></b>

<br><br>

<button id="refreshButton">
Refresh Pesanan
</button>

<button id="logoutButton">
Keluar
</button>

</div>

<div id="orders">
Memuat...
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const URL =
"https://ptluxzkjvdhzsiejsmov.supabase.co";

const KEY =
"sb_publishable_KH094rcfrlbQZ2wT9iKbBw_3H4edUdE";

const db =
window.supabase.createClient(URL,KEY);

const loginButton =
document.getElementById("loginButton");

loginButton.addEventListener(
"click",
async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

if(!email || !password){

message.className="error";
message.textContent=
"Email dan password wajib diisi.";

return;

}

loginButton.disabled=true;
loginButton.textContent="Login...";

const result =
await db.auth.signInWithPassword({
email:email,
password:password
});

if(result.error){

message.className="error";

message.textContent=
"Login gagal: "+
result.error.message;

loginButton.disabled=false;
loginButton.textContent="Login";

return;

}

message.className="success";
message.textContent="Login berhasil.";

showAdmin(result.data.session);

});

async function showAdmin(session){

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("adminBox")
.classList.remove("hidden");

document.getElementById("loggedEmail")
.textContent=
"Login: "+
session.user.email;

loadOrders();

}

async function loadOrders(){

const box =
document.getElementById("orders");

box.innerHTML=
"Memuat pesanan...";

const result =
await db
.from("orders")
.select("*")
.order("id",{ascending:false});

if(result.error){

box.innerHTML=
'<div class="card error">'+
result.error.message+
'</div>';

return;

}

if(!result.data.length){

box.innerHTML=
'<div class="card">Belum ada pesanan.</div>';

return;

}

box.innerHTML="";

result.data.forEach(order=>{

const total =
Number(order.price_per_item||0) *
Number(order.quantity||1);

const div =
document.createElement("div");

div.className="card order";

div.innerHTML=`

<h2>Order #${order.id}</h2>

<p>Nama: ${safe(order.customer_name)}</p>

<p>Produk: ${safe(order.product_name)}</p>

<p>Jumlah: ${order.quantity||1}</p>

<p>Harga: Rp${total.toLocaleString("id-ID")}</p>

<p>Kontak: ${safe(order.customer_email)}</p>

<p>Metode pembayaran:
${safe(order.payment_method)}</p>

<p>Status pembayaran:
<b>${paymentStatus(order.payment_status)}</b>
</p>

<p>Status pesanan:
<b>${orderStatus(order.status)}</b>
</p>

<button onclick="acceptPayment(${order.id})">
Pembayaran Diterima
</button>

<button onclick="rejectOrder(${order.id})">
Tolak
</button>

<button onclick="completeOrder(${order.id})">
Pesanan Selesai
</button>

`;

box.appendChild(div);

});

}

function paymentStatus(status){

if(status==="waiting_verification")
return "Menunggu Verifikasi";

if(status==="paid")
return "Pembayaran Diterima";

if(status==="rejected")
return "Pembayaran Ditolak";

return "Belum Dibayar";

}

function orderStatus(status){

if(status==="pending")
return "Menunggu Pembayaran";

if(status==="processing")
return "Sedang Diproses";

if(status==="completed")
return "Selesai";

if(status==="cancelled")
return "Dibatalkan";

return status||"-";

}

async function acceptPayment(id){

if(!confirm(
"Terima pembayaran Order #"+id+"?"
)) return;

const result =
await db
.from("orders")
.update({
payment_status:"paid",
status:"processing"
})
.eq("id",id);

if(result.error){

alert(result.error.message);
return;

}

loadOrders();

}

async function rejectOrder(id){

if(!confirm(
"Tolak Order #"+id+"?"
)) return;

const result =
await db
.from("orders")
.update({
payment_status:"rejected",
status:"cancelled"
})
.eq("id",id);

if(result.error){

alert(result.error.message);
return;

}

loadOrders();

}

async function completeOrder(id){

if(!confirm(
"Selesaikan Order #"+id+"?"
)) return;

const result =
await db
.from("orders")
.update({
status:"completed"
})
.eq("id",id);

if(result.error){

alert(result.error.message);
return;

}

loadOrders();

}

document.getElementById("refreshButton")
.addEventListener(
"click",
loadOrders
);

document.getElementById("logoutButton")
.addEventListener(
"click",
async function(){

await db.auth.signOut();

location.reload();

});

function safe(value){

return String(value||"-")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}

</script>

</body>
</html>
